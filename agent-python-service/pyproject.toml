[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "familyos-agent-indexer"
version = "0.1.0"
description = "FamilyOS Python document indexing worker"
requires-python = ">=3.10"
dependencies = [
  "grpcio>=1.62,<2",
  "httpx>=0.27,<1",
  "langchain-core>=0.3,<1",
  "langchain-text-splitters>=0.3,<1",
  "langgraph>=0.2,<1",
  "langgraph-checkpoint-sqlite>=2,<4",
  "prometheus-client>=0.20,<1",
  "opentelemetry-api>=1.25,<2",
  "opentelemetry-sdk>=1.25,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.25,<2",
  "protobuf>=7.35.1,<8",
  "PyMySQL>=1.1,<2",
  "PyYAML>=6,<7",
  "pymilvus>=2.5,<3",
  "FlagEmbedding>=1.3,<2",
  "unstructured[md,pdf]>=0.18.3,<0.19"
]

[project.scripts]
familyos-agent-indexer = "familyos_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]
