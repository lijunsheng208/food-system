syntax = "proto3";

package family.v1;

option go_package = "github.com/lijunsheng/familyos/proto/gen/family/v1;familyv1";

// FamilyService 家庭服务
service FamilyService {
  // GetMyFamily 查询我的家庭
  rpc GetMyFamily(GetMyFamilyRequest) returns (GetMyFamilyResponse);
  // CreateFamily 创建家庭
  rpc CreateFamily(CreateFamilyRequest) returns (CreateFamilyResponse);
  // UpdateFamily 修改家庭信息
  rpc UpdateFamily(UpdateFamilyRequest) returns (CommonResponse);
  // JoinFamily 通过邀请码加入家庭
  rpc JoinFamily(JoinFamilyRequest) returns (JoinFamilyResponse);
  // LeaveFamily 退出家庭
  rpc LeaveFamily(LeaveFamilyRequest) returns (CommonResponse);
  // DissolveFamily 解散家庭
  rpc DissolveFamily(DissolveFamilyRequest) returns (CommonResponse);
  // ListMembers 查询家庭成员列表
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  // UpdateMember 修改成员信息
  rpc UpdateMember(UpdateMemberRequest) returns (CommonResponse);
  // RemoveMember 移除成员
  rpc RemoveMember(RemoveMemberRequest) returns (CommonResponse);
  // ResetInviteCode 重置邀请码
  rpc ResetInviteCode(ResetInviteCodeRequest) returns (ResetInviteCodeResponse);
  // GetDietaryProfile 查询家庭饮食档案
  rpc GetDietaryProfile(GetDietaryProfileRequest) returns (GetDietaryProfileResponse);
  // SaveDietaryProfile 保存家庭饮食档案
  rpc SaveDietaryProfile(SaveDietaryProfileRequest) returns (SaveDietaryProfileResponse);
  // CreateMealPlan 将菜谱加入家庭菜单
  rpc CreateMealPlan(CreateMealPlanRequest) returns (CreateMealPlanResponse);
  rpc ListMealPlans(ListMealPlansRequest) returns (ListMealPlansResponse);
  rpc UpdateMealPlan(UpdateMealPlanRequest) returns (CreateMealPlanResponse);
  rpc DeleteMealPlan(DeleteMealPlanRequest) returns (CommonResponse);
  // UpsertMealPlanRating 保存或更新当前用户对已完成家庭菜单的评价
  rpc UpsertMealPlanRating(UpsertMealPlanRatingRequest) returns (MealPlanRatingResponse);
  // ListMealPlanRatings 查询某次家庭菜单的成员评价
  rpc ListMealPlanRatings(ListMealPlanRatingsRequest) returns (MealPlanRatingsResponse);
  // GenerateShoppingList 根据家庭菜单生成购物清单
  rpc GenerateShoppingList(GenerateShoppingListRequest) returns (ShoppingListResponse);
  // ListShoppingLists 查询家庭购物清单
  rpc ListShoppingLists(ListShoppingListsRequest) returns (ShoppingListsResponse);
  // GetShoppingList 查询购物清单详情
  rpc GetShoppingList(GetShoppingListRequest) returns (ShoppingListResponse);
  // UpdateShoppingItemPurchased 更新购物项目购买状态
  rpc UpdateShoppingItemPurchased(UpdateShoppingItemPurchasedRequest) returns (CommonResponse);
  // AddManualShoppingItem 添加手动购物项目
  rpc AddManualShoppingItem(AddManualShoppingItemRequest) returns (ShoppingItemResponse);
  // DeleteShoppingItem 删除购物项目
  rpc DeleteShoppingItem(DeleteShoppingItemRequest) returns (CommonResponse);
}

// ========== Family ==========

message FamilyInfo {
  int64  id               = 1;
  string name             = 2;
  string avatar           = 3;
  string description      = 4;
  int64  owner_user_id    = 5;
  string invite_code      = 6;
  int32  member_count     = 7;
  int32  max_member_count = 8;
  int32  my_role          = 9;
  string created_at       = 10;
  string updated_at       = 11;
}

message GetMyFamilyRequest {
  int64 user_id = 1;
}

message GetMyFamilyResponse {
  int32      code    = 1;
  string     message = 2;
  FamilyInfo family  = 3;
}

message CreateFamilyRequest {
  int64  user_id     = 1;
  string name        = 2;
  string avatar      = 3;
  string description = 4;
}

message CreateFamilyResponse {
  int32  code        = 1;
  string message     = 2;
  int64  family_id   = 3;
  string invite_code = 4;
}

message UpdateFamilyRequest {
  int64  family_id   = 1;
  int64  user_id     = 2;
  string name        = 3;
  string avatar      = 4;
  string description = 5;
}

// ========== Member ==========

message FamilyMemberInfo {
  int64  user_id      = 1;
  string phone        = 2;
  string nickname     = 3;
  string avatar       = 4;
  int32  role         = 5;
  string relation     = 6;
  string display_name = 7;
  string joined_at    = 8;
}

message ListMembersRequest {
  int64 family_id = 1;
  int64 user_id   = 2;
}

message ListMembersResponse {
  int32                    code    = 1;
  string                   message = 2;
  repeated FamilyMemberInfo members = 3;
}

message UpdateMemberRequest {
  int64  family_id        = 1;
  int64  operator_user_id = 2;
  int64  member_user_id   = 3;
  int32  role             = 4;
  string relation         = 5;
  string display_name     = 6;
}

message RemoveMemberRequest {
  int64 family_id        = 1;
  int64 operator_user_id = 2;
  int64 member_user_id   = 3;
}

// ========== Join / Leave / Dissolve ==========

message JoinFamilyRequest {
  int64  user_id      = 1;
  string invite_code  = 2;
  string relation     = 3;
  string display_name = 4;
}

message JoinFamilyResponse {
  int32  code      = 1;
  string message   = 2;
  int64  family_id = 3;
}

message LeaveFamilyRequest {
  int64 user_id = 1;
}

message DissolveFamilyRequest {
  int64 family_id = 1;
  int64 user_id   = 2;
}

// ========== Invite Code ==========

message ResetInviteCodeRequest {
  int64 family_id    = 1;
  int64 user_id      = 2;
  int32 expire_hours = 3;
}

message ResetInviteCodeResponse {
  int32  code                    = 1;
  string message                 = 2;
  string invite_code             = 3;
  string invite_code_expired_at  = 4;
}

// ========== Dietary Profile ==========

message FamilyDietaryProfileInfo {
  int64 id = 1;
  int64 family_id = 2;
  optional double budget_min = 3;
  optional double budget_max = 4;
  string budget_currency = 5;
  int32 budget_period = 6;
  string notes = 7;
  int64 updated_by = 8;
  string created_at = 9;
  string updated_at = 10;
}

message GetDietaryProfileRequest { int64 family_id = 1; int64 user_id = 2; }
message GetDietaryProfileResponse {
  int32 code = 1;
  string message = 2;
  FamilyDietaryProfileInfo profile = 3;
}
message SaveDietaryProfileRequest {
  int64 family_id = 1;
  int64 user_id = 2;
  optional double budget_min = 3;
  optional double budget_max = 4;
  string budget_currency = 5;
  int32 budget_period = 6;
  string notes = 7;
}
message SaveDietaryProfileResponse {
  int32 code = 1;
  string message = 2;
  FamilyDietaryProfileInfo profile = 3;
}

// ========== Meal Plan ==========

message CreateMealPlanRequest {
  int64 family_id             = 1;
  int64 dish_id               = 2;
  string meal_date            = 3; // YYYY-MM-DD
  int32 meal_type             = 4; // 1早餐 2午餐 3晚餐
  int32 servings              = 5;
  optional int64 cook_user_id = 6;
  int64 created_by            = 7;
}

message FamilyMealPlanInfo {
  int64 id                    = 1;
  int64 family_id             = 2;
  int64 dish_id               = 3;
  string meal_date            = 4;
  int32 meal_type             = 5;
  int32 servings              = 6;
  optional int64 cook_user_id = 7;
  int32 status                = 8;
  int64 created_by            = 9;
  string created_at           = 10;
  string updated_at           = 11;
  string dish_name            = 12;
  string dish_image_key       = 13;
  string cook_user_name       = 14;
}

message CreateMealPlanResponse {
  int32 code                  = 1;
  string message              = 2;
  FamilyMealPlanInfo meal_plan = 3;
}

message ListMealPlansRequest {
  int64 family_id  = 1;
  int64 user_id    = 2;
  string start_date = 3;
  string end_date   = 4;
}

message ListMealPlansResponse {
  int32 code = 1;
  string message = 2;
  repeated FamilyMealPlanInfo meal_plans = 3;
}

message UpdateMealPlanRequest {
  int64 id = 1;
  int64 user_id = 2;
  optional string meal_date = 3;
  optional int32 meal_type = 4;
  optional int32 servings = 5;
  optional int64 cook_user_id = 6; // 0 表示清空负责人
  optional int32 status = 7; // 做菜状态：0待开始、1烹饪中、2已完成、3已取消
}

message DeleteMealPlanRequest {
  int64 id = 1;
  int64 user_id = 2;
}

message MealPlanRatingInfo {
  int64 id = 1;
  int64 meal_plan_id = 2;
  int64 user_id = 3;
  string user_name = 4;
  int32 rating = 5;
  string comment = 6;
  string created_at = 7;
  string updated_at = 8;
}

message UpsertMealPlanRatingRequest {
  int64 meal_plan_id = 1;
  int64 user_id = 2;
  int32 rating = 3;
  string comment = 4;
}

message MealPlanRatingResponse {
  int32 code = 1;
  string message = 2;
  MealPlanRatingInfo rating = 3;
}

message ListMealPlanRatingsRequest {
  int64 meal_plan_id = 1;
  int64 user_id = 2;
}

message MealPlanRatingsResponse {
  int32 code = 1;
  string message = 2;
  repeated MealPlanRatingInfo ratings = 3;
  double average_rating = 4;
  int32 rating_count = 5;
  optional int32 my_rating = 6;
  string my_comment = 7;
}

// ========== Shopping List ==========

message ShoppingListInfo {
  int64  id         = 1;
  int64  family_id  = 2;
  int64  created_by = 3;
  string name       = 4;
  string start_date = 5;
  string end_date   = 6;
  int32  status     = 7;
  string created_at = 8;
  string updated_at = 9;
}

message ShoppingItemInfo {
  int64  id              = 1;
  int64  shopping_list_id = 2;
  string ingredient_name = 3;
  optional double quantity = 4;
  string quantity_text   = 5;
  string unit            = 6;
  bool   is_purchased    = 7;
  double purchased_quantity = 12;
  string source          = 8;
  int32  sort_order      = 9;
  string created_at      = 10;
  string updated_at      = 11;
}

message ShoppingListResponse {
  int32 code = 1;
  string message = 2;
  ShoppingListInfo shopping_list = 3;
  repeated ShoppingItemInfo items = 4;
}

message ShoppingListsResponse {
  int32 code = 1;
  string message = 2;
  repeated ShoppingListInfo shopping_lists = 3;
}

message GenerateShoppingListRequest {
  int64 family_id = 1;
  string start_date = 2;
  string end_date = 3;
  string name = 4;
  int64 user_id = 5;
}

message ListShoppingListsRequest {
  int64 family_id = 1;
  int64 user_id = 2;
}

message GetShoppingListRequest {
  int64 id = 1;
  int64 user_id = 2;
}

message UpdateShoppingItemPurchasedRequest {
  int64 item_id = 1;
  int64 user_id = 2;
  bool is_purchased = 3;
  optional double purchased_quantity = 4;
}

message AddManualShoppingItemRequest {
  int64 shopping_list_id = 1;
  int64 user_id = 2;
  string ingredient_name = 3;
  optional double quantity = 4;
  string quantity_text = 5;
  string unit = 6;
}

message ShoppingItemResponse {
  int32 code = 1;
  string message = 2;
  ShoppingItemInfo item = 3;
}

message DeleteShoppingItemRequest {
  int64 item_id = 1;
  int64 user_id = 2;
}

// ========== Common ==========

message CommonResponse {
  int32  code    = 1;
  string message = 2;
}
