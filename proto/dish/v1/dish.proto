syntax = "proto3";

package dish.v1;

option go_package = "github.com/lijunsheng/familyos/proto/gen/dish/v1;dishv1";

// DishService 菜谱服务
service DishService {
  // ListCategories 查询所有启用的分类列表
  rpc ListCategories(ListCategoriesRequest) returns (ListCategoriesResponse);
  // ListDishesByCategory 根据分类查询菜谱列表
  rpc ListDishesByCategory(ListDishesByCategoryRequest) returns (ListDishesByCategoryResponse);
  // SearchDishes 按标题关键字搜索菜谱
  rpc SearchDishes(SearchDishesRequest) returns (SearchDishesResponse);
  // GetDishDetail 查询菜谱详情
  rpc GetDishDetail(GetDishDetailRequest) returns (GetDishDetailResponse);
}

// ========== Category ==========

message CategoryInfo {
  int64  id   = 1; // 分类ID
  string name = 2; // 分类名称
  int32  sort = 3; // 排序
}

message ListCategoriesRequest {}

message ListCategoriesResponse {
  int32                 code       = 1;
  string                message    = 2;
  repeated CategoryInfo categories = 3;
}

// ========== Dish ==========

message DishInfo {
  int64  id          = 1;  // 菜谱ID
  int64  category_id = 2;  // 所属分类ID
  string name        = 3;  // 菜名
  string description = 4;  // 描述
  string image_key   = 5;  // OSS图片key
  int32  sort        = 6;  // 排序
  string created_at  = 7;  // 创建时间
  string updated_at  = 8;  // 更新时间
}

message ListDishesByCategoryRequest {
  int64 category_id = 1; // 分类ID
}

message ListDishesByCategoryResponse {
  int32             code    = 1;
  string            message = 2;
  repeated DishInfo dishes  = 3;
}

// ========== Search ==========

message SearchDishesRequest {
  string keyword = 1; // 搜索关键字
}

message SearchDishesResponse {
  int32             code    = 1;
  string            message = 2;
  repeated DishInfo dishes  = 3;
}

// ========== Detail ==========

message GetDishDetailRequest {
  int64 dish_id = 1; // 菜谱ID
}

message IngredientInfo {
  int64 id           = 1; // 食材ID
  string name        = 2; // 食材名称
  optional double amount = 3; // 数值用量
  string amount_text = 4; // 文字用量，例如适量
  string unit        = 5; // 单位
  int32 sort         = 6; // 组内排序
}

message IngredientGroup {
  string name                         = 1; // 分组名称
  repeated IngredientInfo ingredients = 2;
}

message DishStepInfo {
  int64 id            = 1; // 步骤ID
  int32 step_no       = 2; // 步骤序号
  string description  = 3; // 步骤说明
  string image_key    = 4; // 步骤图片OSS key
  int32 timer_seconds = 5; // 步骤计时秒数，0表示不计时
}

message DishDetailInfo {
  int64 id                              = 1;
  int64 category_id                     = 2;
  string name                           = 3;
  string description                    = 4;
  string image_key                      = 5;
  int32 cook_minutes                    = 6;
  int32 difficulty                      = 7;
  int32 servings                        = 8;
  string tips                           = 9;
  repeated IngredientGroup ingredient_groups = 10;
  repeated DishStepInfo steps           = 11;
}

message GetDishDetailResponse {
  int32 code          = 1;
  string message      = 2;
  DishDetailInfo dish = 3;
}
