syntax = "proto3";
package agent.v1;
option go_package = "github.com/lijunsheng/familyos/proto/gen/agent/v1;agentv1";

service AgentChatService {
  rpc CreateConversation(CreateConversationRequest) returns (CreateConversationResponse);
  rpc ChatStream(ChatStreamRequest) returns (stream ChatStreamEvent);
}

service DocumentIndexIngressService {
  rpc AcceptDocumentIndexEvent(AcceptDocumentIndexEventRequest) returns (AcceptDocumentIndexEventResponse);
}

message AcceptDocumentIndexEventRequest {
  bytes event_payload = 1;
}

message AcceptDocumentIndexEventResponse {
  bool duplicate = 1;
}

message CreateConversationRequest {
  int64 user_id = 1;
  int64 knowledge_base_id = 2;
}

message CreateConversationResponse {
  string conversation_id = 1;
}

message ChatStreamRequest {
  int64 user_id = 1;
  int64 knowledge_base_id = 2;
  string conversation_id = 3;
  string message = 4;
  string request_id = 5;
}

message ChatCitation {
  string citation_id = 1;
  string chunk_id = 2;
  int64 document_id = 3;
  string content = 4;
  string document_name = 5;
}

message ChatStreamEvent {
  string type = 1;
  string request_id = 2;
  string content = 3;
  ChatCitation citation = 4;
  string error_code = 5;
  string error_message = 6;
}
