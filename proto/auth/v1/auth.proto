syntax = "proto3";

package auth.v1;

option go_package = "github.com/lijunsheng/familyos/proto/gen/auth/v1;authv1";

// AuthService 认证服务
service AuthService {
  // SendSMSCode 发送短信登录验证码
  rpc SendSMSCode(SendSMSCodeRequest) returns (SendSMSCodeResponse);
  // SMSLogin 使用短信验证码登录，不存在的手机号会自动注册
  rpc SMSLogin(SMSLoginRequest) returns (SMSLoginResponse);
  // RefreshToken 轮换 Refresh Token 并签发新的 Access Token
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  // Logout 注销当前 Refresh Session
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  // Register 用户注册
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // Login 用户登录
  rpc Login(LoginRequest) returns (LoginResponse);
  // GetProfile 查询用户个人信息
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  // UpdateProfile 更新用户个人信息
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  // ListDietaryPreferences 查询用户个人饮食偏好
  rpc ListDietaryPreferences(ListDietaryPreferencesRequest) returns (ListDietaryPreferencesResponse);
  // ReplaceDietaryPreferences 整体保存用户个人饮食偏好
  rpc ReplaceDietaryPreferences(ReplaceDietaryPreferencesRequest) returns (ReplaceDietaryPreferencesResponse);
}

// ========== SMS Code ==========

message SendSMSCodeRequest {
  string phone = 1;
  string client_ip = 2;
}

message SendSMSCodeResponse {
  int32 code = 1;
  string message = 2;
  int32 retry_after_seconds = 3;
}

message SMSLoginRequest {
  string phone = 1;
  string verification_code = 2;
  string device_id = 3;
}

message SMSLoginResponse {
  int32 code = 1;
  string message = 2;
  reserved 3;
  bool is_new_user = 4;
  UserInfo user = 5;
  string access_token = 6;
  string refresh_token = 7;
  int32 expires_in = 8;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  int32 code = 1;
  string message = 2;
  reserved 3;
  string access_token = 4;
  string refresh_token = 5;
  int32 expires_in = 6;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {
  int32 code = 1;
  string message = 2;
}

// ========== Register ==========

message RegisterRequest {
  string phone    = 1; // 手机号
  string password = 2; // 密码
  string nickname = 3; // 昵称
  string device_id = 4;
}

message RegisterResponse {
  int32  code    = 1; // 业务状态码 0=成功
  string message = 2; // 错误信息
  reserved 3;
  int64  user_id = 4; // 用户ID
  string access_token = 5;
  string refresh_token = 6;
  int32 expires_in = 7;
  UserInfo user = 8;
}

// ========== Login ==========

message LoginRequest {
  string phone    = 1; // 手机号
  string password = 2; // 密码
  string device_id = 3;
}

message LoginResponse {
  int32    code    = 1;
  string   message = 2;
  reserved 3;
  UserInfo user    = 4;
  string access_token = 5;
  string refresh_token = 6;
  int32 expires_in = 7;
}

// ========== GetProfile ==========

message GetProfileRequest {
  int64 user_id = 1; // 用户ID
}

message GetProfileResponse {
  int32    code        = 1;
  string   message     = 2;
  UserInfo user        = 3;
  string   family_name = 4; // 当前家庭名称（空表示未加入）
}

// ========== UpdateProfile ==========

message UpdateProfileRequest {
  int64  user_id  = 1;
  string nickname = 2; // 昵称（空则不更新）
  string avatar   = 3; // 头像（空则不更新）
  int32  gender   = 4; // 性别 -1=不更新, 0=未知, 1=男, 2=女
}

message UpdateProfileResponse {
  int32  code    = 1;
  string message = 2;
}

// ========== Dietary Preferences ==========

message DietaryPreferenceInfo {
  int64 id = 1;
  int32 preference_type = 2;
  string preference_value = 3;
  string note = 4;
  string created_at = 5;
  string updated_at = 6;
}

message DietaryPreferenceInput {
  int32 preference_type = 1;
  string preference_value = 2;
  string note = 3;
}

message ListDietaryPreferencesRequest {
  int64 user_id = 1;
}

message ListDietaryPreferencesResponse {
  int32 code = 1;
  string message = 2;
  repeated DietaryPreferenceInfo preferences = 3;
}

message ReplaceDietaryPreferencesRequest {
  int64 user_id = 1;
  repeated DietaryPreferenceInput preferences = 2;
}

message ReplaceDietaryPreferencesResponse {
  int32 code = 1;
  string message = 2;
  repeated DietaryPreferenceInfo preferences = 3;
}

// ========== UserInfo ==========

message UserInfo {
  int64  id        = 1;
  string phone     = 2;
  string nickname  = 3;
  string avatar    = 4;
  int32  gender    = 5; // 0未知 1男 2女
  int32  status    = 6;
  string last_login_at = 7;
  string created_at    = 8;
  string updated_at    = 9;
}
