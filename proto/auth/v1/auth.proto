syntax = "proto3";

package auth.v1;

option go_package = "github.com/lijunsheng/familyos/proto/gen/auth/v1;authv1";

// AuthService 认证服务
service AuthService {
  // Register 用户注册
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // Login 用户登录
  rpc Login(LoginRequest) returns (LoginResponse);
}

// ========== Register ==========

message RegisterRequest {
  string phone    = 1; // 手机号
  string password = 2; // 密码
  string nickname = 3; // 昵称
}

message RegisterResponse {
  int32  code    = 1; // 业务状态码 0=成功
  string message = 2; // 错误信息
  string token   = 3; // JWT Token
  int64  user_id = 4; // 用户ID
}

// ========== Login ==========

message LoginRequest {
  string phone    = 1; // 手机号
  string password = 2; // 密码
}

message LoginResponse {
  int32    code    = 1;
  string   message = 2;
  string   token   = 3;
  UserInfo user    = 4;
}

// ========== UserInfo ==========

message UserInfo {
  int64  id        = 1;
  string phone     = 2;
  string nickname  = 3;
  string avatar    = 4;
  int32  gender    = 5; // 0未知 1男 2女
  int32  status    = 6;
  string last_login_at = 7;
  string created_at    = 8;
  string updated_at    = 9;
}
