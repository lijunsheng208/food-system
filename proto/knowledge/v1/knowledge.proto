syntax = "proto3";
package knowledge.v1;
option go_package = "github.com/lijunsheng/familyos/proto/gen/knowledge/v1;knowledgev1";

service KnowledgeService {
  rpc EnsurePersonalKnowledgeBase(EnsurePersonalKnowledgeBaseRequest) returns (EnsurePersonalKnowledgeBaseResponse);
  rpc CreateUploadTicket(CreateUploadTicketRequest) returns (CreateUploadTicketResponse);
  rpc CompleteUpload(CompleteUploadRequest) returns (CompleteUploadResponse);
  rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse);
  rpc GetDocumentStatus(GetDocumentStatusRequest) returns (GetDocumentStatusResponse);
  rpc ListKnowledgeDocuments(ListKnowledgeDocumentsRequest) returns (ListKnowledgeDocumentsResponse);
  rpc GetDocumentViewTicket(GetDocumentViewTicketRequest) returns (GetDocumentViewTicketResponse);
}

service KnowledgeInternalService {
  rpc GetDocumentDownloadTicket(GetDocumentDownloadTicketRequest) returns (GetDocumentDownloadTicketResponse);
  rpc CompleteDocumentIndex(CompleteDocumentIndexRequest) returns (CompleteDocumentIndexResponse);
  rpc FailDocumentIndex(FailDocumentIndexRequest) returns (FailDocumentIndexResponse);
}

message CompleteDocumentIndexRequest { int64 document_id = 1; int32 index_version = 2; }
message CompleteDocumentIndexResponse { int32 code = 1; string message = 2; }
message FailDocumentIndexRequest { int64 document_id = 1; int32 index_version = 2; string failure_code = 3; string failure_message = 4; }
message FailDocumentIndexResponse { int32 code = 1; string message = 2; }

message EnsurePersonalKnowledgeBaseRequest { int64 user_id = 1; }
message EnsurePersonalKnowledgeBaseResponse { int32 code = 1; string message = 2; int64 knowledge_base_id = 3; }

message CreateUploadTicketRequest { int64 user_id = 1; int64 knowledge_base_id = 2; string filename = 3; string content_type = 4; int64 file_size = 5; string sha256 = 6; }
message CreateUploadTicketResponse { int32 code = 1; string message = 2; int64 document_id = 3; string upload_session_id = 4; string upload_url = 5; string method = 6; map<string,string> required_headers = 7; string expires_at = 8; }
message CompleteUploadRequest { int64 user_id = 1; int64 document_id = 2; }
message CompleteUploadResponse { int32 code = 1; string message = 2; int64 document_id = 3; int32 status = 4; int32 index_version = 5; }
message DeleteDocumentRequest { int64 user_id = 1; int64 document_id = 2; }
message DeleteDocumentResponse { int32 code = 1; string message = 2; int64 document_id = 3; int32 status = 4; }
message GetDocumentStatusRequest { int64 user_id = 1; int64 document_id = 2; }
message GetDocumentStatusResponse { int32 code = 1; string message = 2; int64 document_id = 3; int32 status = 4; int32 index_version = 5; }
message ListKnowledgeDocumentsRequest { int64 user_id = 1; int64 knowledge_base_id = 2; }
message KnowledgeDocumentItem { int64 document_id = 1; string filename = 2; int64 file_size = 3; int32 status = 4; int32 index_version = 5; string created_at = 6; }
message ListKnowledgeDocumentsResponse { int32 code = 1; string message = 2; repeated KnowledgeDocumentItem documents = 3; }
message GetDocumentViewTicketRequest { int64 user_id = 1; int64 document_id = 2; }
message GetDocumentViewTicketResponse { int32 code = 1; string message = 2; int64 document_id = 3; string view_url = 4; string filename = 5; string content_type = 6; string expires_at = 7; }

message GetDocumentDownloadTicketRequest { int64 document_id = 1; int32 index_version = 2; }
message GetDocumentDownloadTicketResponse {
  int32 code = 1;
  string message = 2;
  int64 document_id = 3;
  int32 index_version = 4;
  string download_url = 5;
  string original_filename = 6;
  string file_extension = 7;
  string content_type = 8;
  int64 file_size = 9;
  string sha256 = 10;
  string expires_at = 11;
}
